# CONFIGURACIÓN BASE DEL SITIO
baseURL = "https://albertomoyano.github.io/gbpublisher-docs/"
title   = "gbpublisher - Documentación"
languageCode           = "es-ar"
defaultContentLanguage = "es"

# OUTPUTS PARA BÚSQUEDA LOCAL Y RSS
# JSON es requerido por Lunr para indexar el contenido
[outputs]
  home    = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS", "JSON"]

# TAXONOMÍAS (deben estar al nivel raíz, no dentro de params)
[taxonomies]
  tag      = "tags"
  category = "categories"

# HUGO MODULES: Docsy como dependencia de módulo
[module]
  proxy = "direct"
  [[module.imports]]
    path = "github.com/google/docsy"

# CONFIGURACIÓN DE MARKUP
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true          # Permite HTML embebido en Markdown
  [markup.highlight]
    style = "tango"
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 2
    ordered    = false

# PARÁMETROS ESPECÍFICOS DE DOCSY
[params]
  description = "Manual de uso de gbpublisher y guía de escritura científica"
  author      = "Alberto Moyano - Estudio 2A"

  # Repositorio de la documentación (habilita botones "Editar" y "Crear issue" por página)
  github_repo         = "https://github.com/albertomoyano/gbpublisher-docs"
  # Repositorio del proyecto principal (aparece como enlace separado en la UI)
  github_project_repo = "https://github.com/albertomoyano/gbpublisher"
  github_branch       = "main"

  # Secciones que se incluyen en el feed RSS principal
  rss_sections = ["docs", "blog"]

  # BÚSQUEDA LOCAL CON LUNR (sin dependencia de servicios externos)
  offlineSearch              = true
  offlineSearchSummaryLength = 200
  offlineSearchMaxResults    = 10

  # CONFIGURACIÓN DE INTERFAZ
  [params.ui]
    sidebar_menu_compact   = true
    breadcrumb_disable     = false
    sidebar_search_disable = false
    navbar_logo            = true
    footer_about_disable   = false

  # ENLACES EN EL PIE DE PÁGINA
  # params.links.user → columna izquierda del footer (orientados al usuario final)
  # params.links.developer → columna derecha del footer (orientados a colaboradores técnicos)
  [params.links]
    [[params.links.user]]
      name = "Repositorio gbpublisher"
      url  = "https://github.com/albertomoyano/gbpublisher"
      icon = "fab fa-github"
      desc = "Código fuente de gbpublisher"
    [[params.links.user]]
      name = "Estudio 2A"
      url  = "https://estudio2a.netlify.app/"
      icon = "fas fa-home"
      desc = "Sitio web de Estudio 2A"
    [[params.links.user]]
      name = "RSS Feed"
      url  = "https://albertomoyano.github.io/gbpublisher-docs/index.xml"
      icon = "fas fa-rss"
      desc = "Suscribite a las actualizaciones de gbpublisher"

# CONFIGURACIÓN MULTILINGÜE
[languages]

  [languages.es]
    languageName = "Español"
    contentDir   = "content/es"
    weight       = 1
    title        = "gbpublisher - Documentación"
    [languages.es.params]
      [languages.es.params.copyright]
        authors   = "Estudio 2A | Contenido bajo licencia [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.es)"
        from_year = 2025

  [languages.en]
    languageName = "English"
    contentDir   = "content/en"
    weight       = 2
    title        = "gbpublisher - Documentation"
    [languages.en.params]
      [languages.en.params.copyright]
        authors   = "Estudio 2A | Content licensed under [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.en)"
        from_year = 2025

  [languages.pt]
    languageName = "Português"
    contentDir   = "content/pt"
    weight       = 3
    title        = "gbpublisher - Documentação"
    [languages.pt.params]
      [languages.pt.params.copyright]
        authors   = "Estudio 2A | Conteúdo sob licença [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.pt)"
        from_year = 2025
